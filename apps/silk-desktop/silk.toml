[package]
main = "tasks.silk"
name = "t3code-silk"
description = "T3 Code desktop on Silk UI: silk task dev, silk task build"
version = "0.1.0"
silk-version = "0.1.0-dev.90+43166993a300"

# The app is JavaScript, in web/. Silk only builds the tasks, which build and run the app.
[dependencies]
silkui = { git = "https://github.com/silk-lang/silkui.git", rev = "4a711dbefdcf0fa195ecb86842ca9585e0f995fe", path = "modules/silkui", package = "silkui" }
silkui_window = { git = "https://github.com/silk-lang/silkui.git", rev = "4a711dbefdcf0fa195ecb86842ca9585e0f995fe", path = "modules/silkui/window", package = "silkui-window" }
silkui_window_node = { git = "https://github.com/silk-lang/silkui.git", rev = "4a711dbefdcf0fa195ecb86842ca9585e0f995fe", path = "modules/silkui/window/node", package = "silkui-window-node" }
ui_tree = { git = "https://github.com/silk-lang/silkui.git", rev = "4a711dbefdcf0fa195ecb86842ca9585e0f995fe", path = "modules/tree", package = "ui-tree" }
ui_inspect_server = { git = "https://github.com/silk-lang/silkui.git", rev = "4a711dbefdcf0fa195ecb86842ca9585e0f995fe", path = "modules/inspect/server", package = "ui-inspect-server" }
silkjs = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "33608cc5dc56658347e56f855cb110726363a0cd", path = "modules/engine", package = "silkjs-engine" }
node_runtime = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "33608cc5dc56658347e56f855cb110726363a0cd", path = "modules/runtime", package = "silkjs-runtime" }

