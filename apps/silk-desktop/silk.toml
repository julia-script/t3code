[package]
main = "tasks.silk"
name = "t3code-silk"
description = "T3 Code desktop on Silk UI: silk task dev, silk task build"
version = "0.1.0"
silk-version = "0.1.0-dev.100+8f42b4e7342a"

# The app is JavaScript, in web/. Silk only builds the tasks, which build and run the app.
[dependencies]
silkui = { git = "https://github.com/silk-lang/silkui.git", rev = "c46d75e8b13b7ecbb9b27349dd82a809e9dd964f", path = "modules/silkui", package = "silkui" }
silkui_window = { git = "https://github.com/silk-lang/silkui.git", rev = "c46d75e8b13b7ecbb9b27349dd82a809e9dd964f", path = "modules/silkui/window", package = "silkui-window" }
silkui_window_node = { git = "https://github.com/silk-lang/silkui.git", rev = "c46d75e8b13b7ecbb9b27349dd82a809e9dd964f", path = "modules/silkui/window/node", package = "silkui-window-node" }
ui_tree = { git = "https://github.com/silk-lang/silkui.git", rev = "c46d75e8b13b7ecbb9b27349dd82a809e9dd964f", path = "modules/tree", package = "ui-tree" }
ui_inspect_server = { git = "https://github.com/silk-lang/silkui.git", rev = "c46d75e8b13b7ecbb9b27349dd82a809e9dd964f", path = "modules/inspect/server", package = "ui-inspect-server" }
silkjs = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "f7f07787c9c612eaeb686d04afcdbd6749e8b7f7", path = "modules/engine", package = "silkjs-engine" }
node_runtime = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "f7f07787c9c612eaeb686d04afcdbd6749e8b7f7", path = "modules/runtime", package = "silkjs-runtime" }

