[package]
main = "tasks.silk"
name = "t3code-silk"
description = "T3 Code desktop on Silk UI: silk task dev, silk task build"
version = "0.1.0"
silk-version = "0.1.0-dev.96+8a1225a6d72a"

# The app is JavaScript, in web/. Silk only builds the tasks, which build and run the app.
[dependencies]
silkui = { git = "https://github.com/silk-lang/silkui.git", rev = "23f134b38e54c345dfacbfa6ed395792e07d19ae", path = "modules/silkui", package = "silkui" }
silkui_window = { git = "https://github.com/silk-lang/silkui.git", rev = "23f134b38e54c345dfacbfa6ed395792e07d19ae", path = "modules/silkui/window", package = "silkui-window" }
silkui_window_node = { git = "https://github.com/silk-lang/silkui.git", rev = "23f134b38e54c345dfacbfa6ed395792e07d19ae", path = "modules/silkui/window/node", package = "silkui-window-node" }
ui_tree = { git = "https://github.com/silk-lang/silkui.git", rev = "23f134b38e54c345dfacbfa6ed395792e07d19ae", path = "modules/tree", package = "ui-tree" }
ui_inspect_server = { git = "https://github.com/silk-lang/silkui.git", rev = "23f134b38e54c345dfacbfa6ed395792e07d19ae", path = "modules/inspect/server", package = "ui-inspect-server" }
silkjs = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "258e3fb55d59096d539a6186a833aec6b99e8b36", path = "modules/engine", package = "silkjs-engine" }
node_runtime = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "258e3fb55d59096d539a6186a833aec6b99e8b36", path = "modules/runtime", package = "silkjs-runtime" }

