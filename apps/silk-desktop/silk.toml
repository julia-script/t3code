[package]
main = "tasks.silk"
name = "t3code-silk"
description = "T3 Code desktop on Silk UI: silk task dev, silk task build"
version = "0.1.0"
silk-version = "0.1.0-dev.98+dc4d2328ed3a"

# The app is JavaScript, in web/. Silk only builds the tasks, which build and run the app.
[dependencies]
silkui = { git = "https://github.com/silk-lang/silkui.git", rev = "d90453c75a70ded821fdeb53073352a2c8d18027", path = "modules/silkui", package = "silkui" }
silkui_window = { git = "https://github.com/silk-lang/silkui.git", rev = "d90453c75a70ded821fdeb53073352a2c8d18027", path = "modules/silkui/window", package = "silkui-window" }
silkui_window_node = { git = "https://github.com/silk-lang/silkui.git", rev = "d90453c75a70ded821fdeb53073352a2c8d18027", path = "modules/silkui/window/node", package = "silkui-window-node" }
ui_tree = { git = "https://github.com/silk-lang/silkui.git", rev = "d90453c75a70ded821fdeb53073352a2c8d18027", path = "modules/tree", package = "ui-tree" }
ui_inspect_server = { git = "https://github.com/silk-lang/silkui.git", rev = "d90453c75a70ded821fdeb53073352a2c8d18027", path = "modules/inspect/server", package = "ui-inspect-server" }
silkjs = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "eafd44a0e3cb2ceef42d03a42a8160349d584fcb", path = "modules/engine", package = "silkjs-engine" }
node_runtime = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "eafd44a0e3cb2ceef42d03a42a8160349d584fcb", path = "modules/runtime", package = "silkjs-runtime" }

