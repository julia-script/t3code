[package]
main = "tasks.silk"
name = "t3code-silk"
description = "T3 Code desktop on Silk UI: silk task dev, silk task build"
version = "0.1.0"
silk-version = "0.1.0-dev.98+dc4d2328ed3a"

# The app is JavaScript, in web/. Silk only builds the tasks, which build and run the app.
[dependencies]
silkui = { git = "https://github.com/silk-lang/silkui.git", rev = "6e376d8e051d2bf155d70a3bb9d049d86aacbe5f", path = "modules/silkui", package = "silkui" }
silkui_window = { git = "https://github.com/silk-lang/silkui.git", rev = "6e376d8e051d2bf155d70a3bb9d049d86aacbe5f", path = "modules/silkui/window", package = "silkui-window" }
silkui_window_node = { git = "https://github.com/silk-lang/silkui.git", rev = "6e376d8e051d2bf155d70a3bb9d049d86aacbe5f", path = "modules/silkui/window/node", package = "silkui-window-node" }
ui_tree = { git = "https://github.com/silk-lang/silkui.git", rev = "6e376d8e051d2bf155d70a3bb9d049d86aacbe5f", path = "modules/tree", package = "ui-tree" }
ui_inspect_server = { git = "https://github.com/silk-lang/silkui.git", rev = "6e376d8e051d2bf155d70a3bb9d049d86aacbe5f", path = "modules/inspect/server", package = "ui-inspect-server" }
silkjs = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "61ef8e0ed663a2b8891d421768d062ae45c26d0c", path = "modules/engine", package = "silkjs-engine" }
node_runtime = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "61ef8e0ed663a2b8891d421768d062ae45c26d0c", path = "modules/runtime", package = "silkjs-runtime" }

